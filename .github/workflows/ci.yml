name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test and quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # required for OIDC federated login to Azure

    env:
      IMAGE_NAME: team6-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Work out image tags
        id: meta
        run: |
          short_sha="${GITHUB_SHA::7}"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            tags="pr-${{ github.event.number }}"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tags="$short_sha latest"
          else
            tags="$short_sha"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build --tag "$IMAGE_NAME:${{ steps.meta.outputs.short_sha }}" .

      # Only authenticate when we actually intend to push.
      - name: Log in to Azure
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: az acr login --name "${{ secrets.ACR_LOGIN_SERVER }}"

      - name: Push image to ACR
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: |
          for tag in ${{ steps.meta.outputs.tags }}; do
            target="${{ secrets.ACR_LOGIN_SERVER }}/$IMAGE_NAME:$tag"
            docker tag "$IMAGE_NAME:${{ steps.meta.outputs.short_sha }}" "$target"
            docker push "$target"
            echo "pushed $target" >> "$GITHUB_STEP_SUMMARY"
          done
